<html lang="es" data-mode="m">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Chewy&display=swap">
<style>
:root{--bg:#f6f2fc;--card:#fff;--ink:#3b3355;--mute:#7d7596;--lila:#b7a2ea;--lila-d:#7f66c9;--verde:#cfe9d6;--verde-d:#3f8a5c;--rosa:#c0566e;--line:#e6def5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a2b;--card:#2a2539;--ink:#ece8f7;--mute:#a69fc0;--lila:#8b74d4;--lila-d:#c9b9f5;--verde:#28402f;--verde-d:#9fd8b2;--rosa:#f0a0b4;--line:#3a3450}}
:root[data-theme="dark"]{--bg:#1e1a2b;--card:#2a2539;--ink:#ece8f7;--mute:#a69fc0;--lila:#8b74d4;--lila-d:#c9b9f5;--verde:#28402f;--verde-d:#9fd8b2;--rosa:#f0a0b4;--line:#3a3450}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 18px}
.back{border:0;background:transparent;color:var(--lila-d);font:inherit;font-weight:600;padding:6px 0;margin-bottom:6px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.big{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer;border-radius:22px;padding:22px 20px;margin-bottom:14px;border:1px solid var(--line)}
.big b{display:block;font-size:1.25rem;font-weight:800}
.big span{color:var(--mute)}
.big.f{background:var(--verde)}.big.a{background:var(--card);border-color:var(--lila)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--lila-d);outline-offset:1px}
.grow{flex:1}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;background:var(--lila);color:#fff;cursor:pointer}
.btn.soft{background:var(--verde);color:var(--verde-d)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;border-radius:10px;padding:9px;font:inherit;font-weight:600;background:transparent;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--verde);color:var(--verde-d)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .n{flex:1}
.item small{display:block;color:var(--mute)}
.tag{color:var(--verde-d);background:var(--verde);border-radius:10px;padding:2px 10px;font-size:.9rem}
.neg{color:var(--rosa);font-weight:600}.pos{color:var(--verde-d);font-weight:600}
.x{border:0;background:transparent;color:var(--mute);font-size:1.2rem;cursor:pointer}
.empty{color:var(--mute);text-align:center;padding:18px 0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum small{display:block;color:var(--mute)}.sum b{font-size:1.05rem}
.rec img{width:100%;max-height:220px;object-fit:cover;border-radius:14px;display:block;margin-bottom:10px}
.rec img.open{max-height:none;object-fit:contain}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;font:inherit;color:var(--ink)}
.tile img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.tile .ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:var(--lila-d);background:var(--verde)}
.tile span{display:block;padding:8px 4px;font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(40,30,70,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .in{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .in input[type=text],.sheet .in textarea{width:100%;margin-bottom:6px}
.lb{display:block;font-weight:600;margin:14px 0 4px;color:var(--lila-d)}
.dimg{width:100%;max-height:200px;object-fit:cover;border-radius:14px;display:block;margin-top:10px}
.big.l{background:var(--lila);border-color:var(--lila);color:#fff}.big.l span{color:#fff;opacity:.9}
:root[data-mode="f"]{--bg:#F7F4D5;--card:#fffdf0;--ink:#3b3a2a;--mute:#7a7752;--line:#e2deb0}
:root[data-mode="m"]{--bg:#2D3436;--card:#394143;--ink:#F7F4D5;--mute:#A9B7C6;--line:#4d585b;--lila:#A9B7C6;--lila-d:#C1BC77;--verde:#4d585b;--verde-d:#A8B58A}
:root[data-mode="m"] .big,:root[data-mode="m"] .big span{color:#2D3436}
:root[data-mode="m"] .big.f{background:#A9B7C6;border-color:#A9B7C6}
:root[data-mode="m"] .big.a{background:#C1BC77;border-color:#C1BC77}
:root[data-mode="m"] .big.l{background:#F7F4D5;border-color:#F7F4D5}
#ali{--verde:#C4E1F6;--verde-d:#2f6f8f}
#act{--verde:#e9e2fb;--verde-d:#6a52b8}
:root[data-mode="m"] #ali{--verde:#4d585b;--verde-d:#C1BC77}
:root[data-mode="m"] #act{--verde:#4d585b;--verde-d:#A9B7C6}
.big.a{background:#C4E1F6;border-color:#C4E1F6;color:var(--ink)}
.big.l{background:#e9e2fb;border-color:#e9e2fb;color:var(--ink)}
.big.l span{color:var(--mute);opacity:1}
#rec{display:none}
.pmn{display:flex;align-items:center;justify-content:space-between}.pmn .x{font-size:1.8rem;padding:0 14px;line-height:1}.pmn b{font-size:1.1rem}
.item.pk input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--verde-d)}.item.gone .n{text-decoration:line-through;opacity:.55}
.bars{display:flex;gap:8px;align-items:flex-end;margin-top:10px}.bc{flex:1;text-align:center}.bv{height:80px;display:flex;align-items:flex-end;background:var(--bg);border-radius:8px;overflow:hidden}.bv i{display:block;width:100%;background:var(--verde-d);border-radius:8px 8px 0 0}.bc small{display:block;color:var(--mute)}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
.bar{height:10px;border-radius:8px;background:var(--verde);overflow:hidden}.bar i{display:block;height:100%;background:var(--verde-d)}
.ing{display:grid;grid-template-columns:1fr 70px 108px;gap:6px;margin-bottom:6px}
.ing select{margin:0;padding:10px 4px;width:100%}
#aseg button{font-size:.8rem;padding:9px 2px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
.s4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}.s4 small{display:block;color:var(--mute)}
.gf{display:none;position:absolute;bottom:6px;font-size:.9rem}
:root[data-mode="m"] .gf{display:block}
#actseg button{font-size:.8rem;padding:9px 2px}.ing input{width:100%}
.sheet .in>input[type=number],.sheet .in>select{width:100%;margin-bottom:6px}
.lb input[type=checkbox]{width:auto;margin-right:6px;transform:scale(1.25)}
main{position:relative;z-index:1}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sun{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:14px;width:56px;height:56px;animation:spin 60s linear infinite}
.fl{position:absolute;bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:1.5rem;opacity:.85;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.sun,.fl{animation:none}}
.sun{right:72px}
.tg{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:5;cursor:pointer}
.tg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.tk{display:block;width:48px;height:26px;border-radius:14px;background:#C4E1F6;border:1px solid var(--line);position:relative;transition:background .25s}
.tk i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#DC9C0E;transition:transform .25s,background .25s}
.tg input:checked+.tk{background:#2D3436}
.tg input:checked+.tk i{transform:translateX(22px);background:#F7F4D5}
.tg input:focus-visible+.tk{outline:2px solid var(--lila-d);outline-offset:2px}
.moon,.st,.grass{display:none}
:root[data-mode="m"] .moon,:root[data-mode="m"] .st,:root[data-mode="m"] .grass{display:block}
:root[data-mode="m"] .sun,:root[data-mode="m"] .fl{display:none}
.moon{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;animation:glow 6s ease-in-out infinite}
.st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
.grass{position:absolute;left:0;right:0;bottom:0;width:100%;height:34px;transform-origin:50% 100%;animation:gs 7s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes gs{0%,100%{transform:skewX(-1deg)}50%{transform:skewX(1deg)}}
@media (prefers-reduced-motion:reduce){.moon,.st,.grass{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer}
.chip.on{background:var(--verde);color:var(--verde-d);border-color:var(--verde-d)}
.th{width:48px;height:48px;border-radius:10px;background:var(--verde);overflow:hidden;flex:none}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.exr .th{width:40px;height:40px}
.exr{display:grid;grid-template-columns:40px 1fr 1fr 1fr 30px;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line);align-items:center}.exr>:nth-child(1){grid-area:1/1}.exr>:nth-child(2){grid-area:1/2/2/5}.exr>:nth-child(3){grid-area:2/2}.exr>:nth-child(4){grid-area:2/3}.exr>:nth-child(5){grid-area:2/4}.exr>:nth-child(6){grid-area:1/5}.exr>.tot{grid-area:3/2/4/5;color:var(--mute);font-size:.8rem}.fld small{display:block;color:var(--mute);font-size:.75rem;margin:0 0 2px 2px}
.stog{display:flex;justify-content:space-between;align-items:center;width:100%;margin:20px 0 10px;padding:14px 16px;font:inherit;font-weight:800;font-size:1.05rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;cursor:pointer}#stch{font-size:1.4rem;color:var(--lila-d)}
.dayph{padding:8px 6px;text-align:center;align-items:center;justify-content:center;aspect-ratio:1}.dcol{display:flex;flex-direction:column;gap:3px;align-items:center;font-size:.78rem;line-height:1.2;color:var(--ink)}.dg{color:var(--lila-d);font-size:.85rem;word-break:break-word}.dl{color:var(--mute)}
.sheet .exr input{width:100%;margin-bottom:0}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
input[type=date],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
select{width:100%;margin-bottom:10px}
.day{padding:0}
.day summary{list-style:none;cursor:pointer;padding:16px;font-weight:800;color:var(--lila-d);display:flex;justify-content:space-between;align-items:center}
.day summary::-webkit-details-marker{display:none}
.day summary::after{content:"›";font-size:1.3rem;transition:transform .2s}
.day[open] summary::after{transform:rotate(90deg)}
.day .meal{padding:0 16px 14px}
.day label{display:block;font-size:.85rem;color:var(--mute);margin:0 0 3px}
.day input,.day textarea{width:100%;margin-bottom:6px}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;min-width:0}
textarea:focus{outline:2px solid var(--lila-d);outline-offset:1px}
.bee{position:fixed;top:0;left:0;z-index:6;pointer-events:none;width:44px;height:36px;animation:fly 32s ease-in-out infinite}
.bee svg{display:block;width:100%;height:100%;animation:bob .7s ease-in-out infinite}
.bee .wg{transform-box:fill-box;transform-origin:50% 100%;animation:flap .09s linear infinite alternate}
@keyframes flap{from{transform:scaleY(1) rotate(-8deg)}to{transform:scaleY(.35) rotate(8deg)}}
@keyframes bob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}
@keyframes fly{0%{transform:translate(-14vw,26vh) scaleX(1)}12%{transform:translate(16vw,16vh) scaleX(1)}25%{transform:translate(42vw,36vh) scaleX(1)}38%{transform:translate(68vw,14vh) scaleX(1)}49%{transform:translate(104vw,28vh) scaleX(1)}50%{transform:translate(104vw,28vh) scaleX(-1)}62%{transform:translate(76vw,46vh) scaleX(-1)}75%{transform:translate(46vw,22vh) scaleX(-1)}88%{transform:translate(18vw,42vh) scaleX(-1)}99%{transform:translate(-14vw,30vh) scaleX(-1)}100%{transform:translate(-14vw,26vh) scaleX(1)}}
@media (prefers-reduced-motion:reduce){.bee,.bee svg,.bee .wg{animation:none}.bee{transform:translate(78vw,14vh)}}
.hh{font-family:"Chewy","Comic Sans MS","Segoe Print",cursive;font-weight:400;font-size:2.7rem;letter-spacing:.02em;margin:20px 0 40px;line-height:1.1}
[hidden]{display:none}
</style>
</head>
<body>
<div class="deco" aria-hidden="true"><svg class="moon" viewBox="0 0 64 64"><defs><mask id="mm"><rect width="64" height="64" fill="#fff"/><circle cx="42" cy="26" r="20" fill="#000"/></mask></defs><circle cx="30" cy="32" r="22" fill="#F7F4D5" mask="url(#mm)"/></svg><i class="st" style="left:8%;top:6%"></i><i class="st" style="left:22%;top:14%;animation-delay:-1s"></i><i class="st" style="left:36%;top:5%;animation-delay:-2s"></i><i class="st" style="left:48%;top:20%;animation-delay:-.5s"></i><i class="st" style="left:60%;top:9%;animation-delay:-1.5s"></i><i class="st" style="left:14%;top:30%;animation-delay:-2.5s"></i><i class="st" style="left:30%;top:38%;animation-delay:-.8s"></i><i class="st" style="left:70%;top:28%;animation-delay:-2.2s"></i><i class="st" style="left:88%;top:36%;animation-delay:-1.2s"></i><i class="st" style="left:80%;top:16%;animation-delay:-.3s"></i><svg class="grass" viewBox="0 0 400 34" preserveAspectRatio="none"><defs><pattern id="gp" width="24" height="34" patternUnits="userSpaceOnUse"><path d="M0 34L4 10L8 34M8 34L13 2L18 34M16 34L20 14L24 34" fill="#7bd36b"/></pattern></defs><rect y="28" width="400" height="6" fill="#4fa24a"/><rect width="400" height="34" fill="url(#gp)"/></svg><span class="gf" style="left:7%">🌼</span><span class="gf" style="left:19%">🌸</span><span class="gf" style="left:33%">🌷</span><span class="gf" style="left:47%">🌼</span><span class="gf" style="left:61%">🌸</span><span class="gf" style="left:75%">🌷</span><span class="gf" style="left:89%">🌼</span></div>
<div class="bee" aria-hidden="true"><svg viewBox="0 0 44 36"><ellipse class="wg" cx="17" cy="9" rx="7" ry="9" fill="#dff1ff" fill-opacity=".85" stroke="#A9B7C6" stroke-width=".8"/><ellipse class="wg" cx="26" cy="9" rx="7" ry="9" fill="#dff1ff" fill-opacity=".85" stroke="#A9B7C6" stroke-width=".8" style="animation-delay:-.04s"/><ellipse cx="22" cy="21" rx="14" ry="9" fill="#F2C94C"/><path d="M17 12.5v17M23 12v18M29 13.5v15" stroke="#2D3436" stroke-width="3.6" stroke-linecap="round"/><circle cx="37" cy="20" r="6" fill="#F2C94C"/><circle cx="39" cy="18.5" r="1.4" fill="#2D3436"/><path d="M38 13c1-3 3-4 5-4M35 13c0-3 1-5 3-6" stroke="#2D3436" stroke-width="1" fill="none" stroke-linecap="round"/><path d="M8 21l-5 1 5 2z" fill="#2D3436"/></svg></div>
<main>
<button class="back" id="back" hidden>‹ Mi agenda</button>
<h1 id="h"></h1>
<p class="sub" id="sub"></p>

<section id="home">
  <button class="big f" id="go-fin"><b>Mis finanzas</b><span>Ingresos, gastos y saldo del mes</span></button>
  <button class="big a" id="go-ali"><b>Alimentación</b><span>Despensa, menú semanal y recetas</span></button>
  <button class="big l" id="go-act"><b>Actividad física</b><span>Rutinas de ejercicio de la semana</span></button>
</section>

<section id="fin" hidden>
  <div class="seg" id="fseg"><button data-f="mov" class="on">Movimientos</button><button data-f="pre">Regla 50/30/20</button><button data-f="met">Metas</button></div>
  <div id="f-mov">
  <div class="card sum" id="sum"></div>
  <div class="card">
    <div class="seg" id="tipo" style="margin-bottom:8px"></div><select id="fk" aria-label="De dónde sale el dinero"><option value="n">Necesidades básicas</option><option value="l">Estilo de vida</option><option value="a">Ahorro</option></select>
    <div class="row">
      <input type="text" id="fc" class="grow" placeholder="Concepto (ej. mercado)" aria-label="Concepto">
      <input type="number" id="fa" inputmode="decimal" placeholder="Valor" style="width:120px" aria-label="Valor">
      <button class="btn" id="fadd">Agregar</button>
    </div>
  </div>
  <div class="card" id="flist"></div>
  </div>
  <div id="f-pre" hidden></div><div id="f-met" hidden></div>
</section>

<section id="ali" hidden>
  <div class="seg" id="aseg"><button data-a="desp" class="on">Despensa</button><button data-a="plan">Menú semanal</button><button data-a="rec">Recetario</button></div>
  <div id="a-desp">
    <div class="card"><div class="row">
      <input type="text" id="pn" class="grow" placeholder="Alimento (ej. arroz)" aria-label="Alimento">
      <button class="btn" id="padd">Agregar</button>
      <select id="pcat" aria-label="Etiqueta" style="margin:0;flex-basis:100%"><option value="">Etiqueta (opcional)</option><option value="c">Carbohidrato</option><option value="g">Grasa</option><option value="f">Fruta</option><option value="p">Proteína</option><option value="l">Lácteos</option><option value="v">Verduras</option></select>
    </div></div>
    <div id="pchips"></div><div class="card" id="plist"></div>
  </div>
  <div id="a-plan" hidden>
    <div class="card pmn"><button type="button" class="x" id="pmp" aria-label="Mes anterior">‹</button><b id="pml"></b><button type="button" class="x" id="pmx" aria-label="Mes siguiente">›</button></div>
    <div class="seg" id="weeks"></div>
    <div id="days"></div>
  </div>
  <div id="a-rec" hidden></div>
</section>
<section id="act" hidden><div class="seg" id="actseg"><button data-v="sem" class="on">Rutina semanal</button><button data-v="lib">Mis ejercicios</button><button data-v="med">Medidas</button></div><div id="asem"><div id="agrid"></div><button type="button" class="stog" id="stog" aria-expanded="false"><span>Estadísticas</span><span id="stch">›</span></button><div id="a-stat" hidden></div></div><div id="alib" hidden></div><div id="a-med" hidden><div class="card" id="mform"></div><div class="card" id="mchart"></div><div class="card" id="mlist"></div></div></section>
</main>
<div class="sheet" id="sheet" hidden></div>
<script>
(function(){
var KEY="agenda-v2";
var DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
var COM=[["b","Desayuno"],["l","Almuerzo"],["s","Merienda"],["d","Cena"]];
function def(){return{pantry:[],wk:0,weeks:[{img:"",d:{}},{img:"",d:{}},{img:"",d:{}},{img:"",d:{}}],mov:[],tipo:"g"}}
var S;

function chips(key){return'<div class="chips" style="margin:0 0 12px"><button type="button" class="chip'+(S[key]?"":" on")+'" data-fc="">Todos</button>'+Object.keys(CC).map(function(k){return'<button type="button" class="chip'+(S[key]===k?" on":"")+'" data-fc="'+k+'">'+CC[k]+'</button>'}).join("")+'</div>'}
function wireChips(box,key,fn){box.querySelectorAll("[data-fc]").forEach(function(b){b.onclick=function(){S[key]=b.dataset.fc;save();fn()}})}
var PL={c:"Carbohidrato",g:"Grasa",f:"Fruta",p:"Proteína",l:"Lácteos",v:"Verduras"};
function renderPantry(){
  S.pantry=S.pantry||[];
  $("pchips").innerHTML='<div class="chips" style="margin:0 0 12px"><button type="button" class="chip'+(S.pf?"":" on")+'" data-fc="">Todos</button>'+Object.keys(PL).map(function(k){return'<button type="button" class="chip'+(S.pf===k?" on":"")+'" data-fc="'+k+'">'+PL[k]+'</button>'}).join("")+'</div>';
  wireChips($("pchips"),"pf",renderPantry);
  var rows=S.pantry.map(function(p,i){return{p:p,i:i}}).filter(function(r){return !S.pf||r.p.c===S.pf});
  rows=rows.filter(function(r){return r.p.h!==false}).concat(rows.filter(function(r){return r.p.h===false}));
  var l=$("plist");
  l.innerHTML=rows.length?rows.map(function(r){var p=r.p,on=p.h!==false;return'<label class="item pk'+(on?"":" gone")+'"><input type="checkbox" data-i="'+r.i+'"'+(on?" checked":"")+' aria-label="'+esc(p.n)+'"><span class="n">'+esc(p.n)+'</span>'+(PL[p.c]?'<span class="tag">'+PL[p.c]+'</span>':"")+'<button class="x" data-del="'+r.i+'" aria-label="Quitar '+esc(p.n)+'">×</button></label>'}).join(""):'<div class="empty">'+(S.pantry.length?"No hay alimentos con esta etiqueta.":"Tu despensa está vacía. Agrega el primer alimento arriba.")+'</div>';
  l.querySelectorAll("input[type=checkbox]").forEach(function(c){c.onchange=function(){S.pantry[+c.dataset.i].h=c.checked;save();renderPantry()}});
  l.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(e){e.preventDefault();S.pantry.splice(+b.dataset.del,1);save();renderPantry()}});
}
function renderAct(){
  S.act=S.act||{};
  $("agrid").innerHTML='<div class="grid">'+DIAS.map(function(d,di){
    var a=S.act[di]||{ex:[],c:0},n=a.ex.length,t=[];if(a.g)t.push('<b class="dg">'+esc(a.g)+'</b>');
    if(n)t.push('<span class="dl">'+n+(n===1?" ejercicio":" ejercicios")+'</span>');
    if(a.c>0)t.push('<span class="dl">'+a.c+' min cardio</span>');
    return'<button class="tile" data-d="'+di+'"><div class="ph dayph"'+(t.length?"":' style="font-size:1.8rem"')+'>'+(t.length?'<div class="dcol">'+t.join("")+'</div>':"+")+'</div><span>'+d+'</span></button>';
  }).join("")+'</div>';
  $("agrid").querySelectorAll(".tile").forEach(function(b){b.onclick=function(){openAct(+b.dataset.d)}});
  setSt();
}
function openAct(di){
  var s=$("sheet"),a=S.act[di]=S.act[di]||{ex:[],c:0},GR=["Glúteos","Cuádriceps","Isquiotibiales","Espalda","Pecho","Hombros","Bíceps","Tríceps","Abdomen","Cardio"];
  s.style.cssText="--verde:#e9e2fb;--verde-d:#6a52b8";s.hidden=false;var picking=false;S.lib=S.lib||[];
  function thumb(e){var l=S.lib.filter(function(x){return x.id===e.lid})[0];return l&&l.img?'<img src="'+l.img+'" alt="">':""}
  function pk(){return'<div class="card" style="margin:10px 0 0"><b>Elige de tu lista</b>'+(S.lib.length?S.lib.map(function(e){return'<label class="item pick" style="cursor:pointer"><input type="checkbox" data-pid="'+e.id+'" aria-label="'+esc(e.n)+'"><div class="th">'+(e.img?'<img src="'+e.img+'" alt="">':"")+'</div><span class="n">'+esc(e.n)+'</span></label>'}).join(""):'<div class="empty">Aún no tienes ejercicios guardados. Créalos en “Mis ejercicios”.</div>')+'<div class="row" style="margin-top:10px">'+(S.lib.length?'<button class="btn" id="okx">Agregar seleccionados</button>':"")+'<button class="btn soft" id="newx">Escribir uno nuevo</button><button class="btn soft" id="cnc">Cancelar</button></div></div>'}
  function draw(){
    s.innerHTML='<div class="in"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">'+DIAS[di]+'</h2><button class="x" id="cl" aria-label="Cerrar">×</button></div><label class="lb" for="grp">Grupo muscular o rutina</label><input type="text" id="grp" placeholder="Elige abajo o escribe" value="'+esc(a.g||"")+'" style="width:100%"><div class="chips">'+GR.map(function(g){return'<button type="button" class="chip'+((a.g||"").split(",").map(function(x){return x.trim()}).indexOf(g)>-1?" on":"")+'">'+g+'</button>'}).join("")+'</div><label class="lb">Ejercicios</label>'+
      (a.ex.length?a.ex.map(function(e,i){return'<div class="exr"><div class="th">'+thumb(e)+'</div><input type="text" data-i="'+i+'" data-f="n" placeholder="Ejercicio" value="'+esc(e.n)+'" aria-label="Ejercicio"><div class="fld"><small>Series</small><input type="number" inputmode="numeric" data-i="'+i+'" data-f="s" placeholder="0" value="'+esc(e.s)+'" aria-label="Series"></div><div class="fld"><small>Repeticiones</small><input type="number" inputmode="numeric" data-i="'+i+'" data-f="r" placeholder="0" value="'+esc(e.r)+'" aria-label="Repeticiones"></div><div class="fld"><small>Peso (kg)</small><input type="number" inputmode="decimal" step="0.5" data-i="'+i+'" data-f="w" placeholder="0" value="'+esc(e.w||"")+'" aria-label="Peso en kilos"></div><button class="x" data-del="'+i+'" aria-label="Quitar ejercicio">×</button><div class="tot">'+tl(e)+'</div></div>'}).join(""):'<div class="empty">Aún no hay ejercicios para este día.</div>')+
      (picking?pk():'<button class="btn soft" id="addx">Agregar ejercicio</button>')+'<label class="lb" for="cmin">Cardio (minutos)</label><input type="number" inputmode="numeric" id="cmin" placeholder="0" value="'+(a.c||"")+'" style="width:100%"></div>';
    $("cl").onclick=close;
    if($("addx"))$("addx").onclick=function(){picking=true;draw()};
    if($("newx")){$("newx").onclick=function(){picking=false;a.ex.push({n:"",s:"",r:""});save();draw()};$("cnc").onclick=function(){picking=false;draw()}}
    if($("okx"))$("okx").onclick=function(){s.querySelectorAll("[data-pid]:checked").forEach(function(c){var e=S.lib.filter(function(x){return x.id===+c.dataset.pid})[0];if(e)a.ex.push({n:e.n,s:"",r:"",lid:e.id})});picking=false;save();draw()};
    s.querySelectorAll('.exr input[data-f="n"]').forEach(function(el){el.onchange=function(){var n=el.value.trim(),e=a.ex[+el.dataset.i];if(!n||!e)return;var l=S.lib.filter(function(x){return nz(x.n)===nz(n)})[0];if(!l){l={id:Date.now(),n:n,img:""};S.lib.push(l)}e.lid=l.id;e.n=l.n;el.value=l.n;save();var th=el.parentNode.querySelector(".th");if(th)th.innerHTML=thumb(e)}});
    s.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){a.ex.splice(+b.dataset.del,1);save();draw()}});
    s.querySelectorAll(".exr input").forEach(function(el){el.oninput=function(){var ee=a.ex[+el.dataset.i];ee[el.dataset.f]=el.value;save();var tt=el.closest(".exr").querySelector(".tot");if(tt)tt.textContent=tl(ee)}});
    $("cmin").oninput=function(){a.c=parseFloat(this.value)||0;save()};
    $("grp").oninput=function(){a.g=this.value;save()};
    s.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){var l=(a.g||"").split(",").map(function(x){return x.trim()}).filter(Boolean),i=l.indexOf(c.textContent);if(i>-1)l.splice(i,1);else l.push(c.textContent);a.g=l.join(", ");save();draw()}});
  }
  function close(){s.hidden=true;renderAct()}
  s.onclick=function(e){if(e.target===s)close()};
  draw();
}
function renderPantryOld(){
  var l=$("plist");
  if(!S.pantry.length){l.innerHTML='<div class="empty">Tu despensa está vacía. Agrega el primer alimento arriba.</div>';return}
  l.innerHTML=S.pantry.map(function(p,i){return'<div class="item"><span class="n">'+esc(p.n)+'</span>'+(p.q?'<span class="tag">'+esc(p.q)+'</span>':'')+'<button class="x" data-i="'+i+'" aria-label="Quitar '+esc(p.n)+'">×</button></div>'}).join("");
  l.querySelectorAll(".x").forEach(function(b){b.onclick=function(){S.pantry.splice(+b.dataset.i,1);save();renderPantry()}});
}
function addPantry(){
  var n=$("pn").value.trim();if(!n)return;
  S.pantry.push({n:n,c:$("pcat").value,h:true});$("pcat").value="";$("pn").value="";save();renderPantry();$("pn").focus();
}
$("padd").onclick=addPantry;
$("pn").onkeydown=function(e){if(e.key==="Enter")addPantry()};

function renderPlan(){
  pmShow();
  var w="";for(var i=0;i<4;i++)w+='<button data-w="'+i+'" class="'+(S.wk===i?"on":"")+'">Semana '+(i+1)+'</button>';
  $("weeks").innerHTML=w;
  $("weeks").querySelectorAll("button").forEach(function(b){b.onclick=function(){S.wk=+b.dataset.w;save();renderPlan()}});
  var wk=curW()[S.wk],IC=["🌙","🌙","🌙","🌙","🌙","🌙","🌙"];
  $("days").innerHTML='<div class="grid">'+DIAS.map(function(d,di){
    return'<button class="tile" data-d="'+di+'"><div class="ph">'+IC[di]+'</div><span>'+d+'</span></button>';
  }).join("")+'</div>';
  $("days").querySelectorAll(".tile").forEach(function(b){b.onclick=function(){openDay(wk,+b.dataset.d)}});
}
function openDay(wk,di){
  var s=$("sheet");s.style.cssText="--verde:#C4E1F6;--verde-d:#2f6f8f";s.hidden=false;
  s.innerHTML='<div class="in"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">'+DIAS[di]+'</h2><button class="x" id="cl" aria-label="Cerrar">×</button></div>'+
    COM.map(function(c){var k=di+c[0]+"i";return'<label class="lb" for="t'+k+'">'+c[1]+'</label><textarea id="t'+k+'" data-k="'+k+'" rows="3" placeholder="Ingredientes" aria-label="Ingredientes de '+c[1]+'">'+esc(wk.d[k]||"")+'</textarea>'}).join("")+'</div>';
  function close(){s.hidden=true;renderPlan()}
  $("cl").onclick=close;
  s.onclick=function(e){if(e.target===s)close()};
  s.querySelectorAll("textarea").forEach(function(el){el.oninput=function(){wk.d[el.dataset.k]=el.value;save()}});
}
function shrink(file,cb,mx){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var m=mx||900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",0.7))};im.src=r.result};
  r.readAsDataURL(file);
}
view("home");renderPantry();
})();
